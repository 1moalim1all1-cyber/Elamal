<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>لوحة إدارة الأمل للدهانات</title><link rel="stylesheet" href="./admin.css"></head><body>
<section id="loginView" class="login-page"><div class="login-card"><div class="brand"><div class="brand-mark">أ</div><h1>إدارة الأمل للدهانات</h1><p>سجّل بالبريد المسجل داخل Firebase Authentication.</p></div><form id="loginForm"><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" value="admin@alamal.com" autocomplete="username" required></div><div class="field"><label for="password">كلمة السر</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div><button id="loginButton" class="primary-button" type="submit">تسجيل الدخول</button><p id="loginMessage" class="message" role="alert"></p></form></div></section>
<section id="dashboardView" hidden><header class="topbar"><div><h1>لوحة إدارة الأمل للدهانات</h1><p>الحساب: <span id="adminEmailLabel"></span></p></div><button id="logoutButton" class="secondary-button" type="button">تسجيل الخروج</button></header><main class="dashboard-main"><section class="panel"><div class="panel-header"><h2>الإعدادات والتواصل</h2><p>يتم الحفظ داخل Firestore في site/settings</p></div><form id="settingsForm" class="form-grid">
<div class="field"><label for="siteName">اسم الموقع</label><input id="siteName" type="text"></div><div class="field"><label for="phone">رقم الهاتف</label><input id="phone" type="tel"></div><div class="field"><label for="whatsapp">رابط واتساب</label><input id="whatsapp" type="url"></div><div class="field"><label for="factoryAddress">عنوان المصنع</label><input id="factoryAddress" type="text"></div><div class="field"><label for="facebook">فيسبوك</label><input id="facebook" type="url"></div><div class="field"><label for="instagram">إنستجرام</label><input id="instagram" type="url"></div><div class="field"><label for="tiktok">تيك توك</label><input id="tiktok" type="url"></div><div class="field"><label for="youtube">يوتيوب</label><input id="youtube" type="url"></div><div class="save-row full-width"><button class="primary-button" type="submit">حفظ البيانات</button><p id="saveMessage" class="message"></p></div></form></section></main></section>
<script type="module" src="./admin.js"></script></body></html>
