<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>جارٍ التحويل...</title>
    <!--
      GitHub Pages مفيهوش سيرفر حقيقي يفهم React Router، فأي رابط داخلي
      (زي /products أو /admin) لو حد فتحه مباشرة أو عمل Refresh، GitHub Pages
      هيرجع 404.html ده. السكريبت هنا بيحوّل الرابط لصيغة تقدر index.html
      تفكّها وترجّع المستخدم لنفس الصفحة اللي كان طالبها، بدون ما يظهر أي 404.
      (تقنية معروفة: spa-github-pages)
    -->
    <script>
      var segmentCount = 0; // 0 لأن الموقع هيتظبط على دومين مخصص من الجذر
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
